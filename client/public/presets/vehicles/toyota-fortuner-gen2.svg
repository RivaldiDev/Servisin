<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_toyota-fortuner-gen2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accentGrad_toyota-fortuner-gen2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="cardGrad_toyota-fortuner-gen2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="400" height="260" rx="20" fill="url(#bgGrad_toyota-fortuner-gen2)"/>
  
  <!-- Subtle Grid Lines -->
  <line x1="0" y1="65" x2="400" y2="65" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="0" y1="185" x2="400" y2="185" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  
  <!-- Ground Reflection Line -->
  <line x1="30" y1="182" x2="370" y2="182" stroke="url(#accentGrad_toyota-fortuner-gen2)" stroke-width="2" opacity="0.6"/>
  <ellipse cx="200" cy="184" rx="160" ry="12" fill="#111827" opacity="0.15"/>

  <!-- Vehicle Silhouette Vector Graphic -->
  <g transform="translate(0, 5)">
    
      <!-- SUV Silhouette -->
      <path d="M 60 145 L 90 115 L 150 100 L 250 100 L 310 120 L 340 145 L 345 160 L 55 160 Z" fill="#111827" opacity="0.85"/>
      <path d="M 100 115 L 148 105 L 148 140 L 85 140 Z" fill="#ffffff" opacity="0.3"/>
      <path d="M 156 105 L 245 105 L 245 140 L 156 140 Z" fill="#ffffff" opacity="0.3"/>
      <path d="M 253 107 L 295 122 L 295 140 L 253 140 Z" fill="#ffffff" opacity="0.2"/>
      <!-- Wheels & Arches -->
      <circle cx="110" cy="160" r="22" fill="#0f172a"/>
      <circle cx="110" cy="160" r="12" fill="#94a3b8"/>
      <circle cx="110" cy="160" r="6" fill="#f8fafc"/>
      <circle cx="290" cy="160" r="22" fill="#0f172a"/>
      <circle cx="290" cy="160" r="12" fill="#94a3b8"/>
      <circle cx="290" cy="160" r="6" fill="#f8fafc"/>
      <!-- Roof Rails -->
      <line x1="130" y1="94" x2="260" y2="94" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
      <!-- Lights -->
      <polygon points="55,147 75,145 70,154 55,152" fill="#fef08a" opacity="0.9"/>
      <polygon points="345,147 330,146 332,154 345,153" fill="#ef4444" opacity="0.9"/>
      
  </g>

  <!-- Top Header Pill Badges -->
  <g transform="translate(20, 20)">
    <!-- Type Pill -->
    <rect x="0" y="0" width="56" height="22" rx="6" fill="#2563eb"/>
    <text x="28" y="15" fill="#ffffff" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="0.5">MOBIL</text>

    <!-- Brand Name -->
    <text x="66" y="16" fill="#f8fafc" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" letter-spacing="0.5">TOYOTA</text>
  </g>

  <!-- Year Range Badge Top Right -->
  <g transform="translate(260, 20)">
    <rect x="0" y="0" width="120" height="22" rx="6" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
    <text x="60" y="15" fill="#e2e8f0" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" text-anchor="middle">📅 2016 – 2026</text>
  </g>

  <!-- Bottom Details Container -->
  <rect x="14" y="194" width="372" height="54" rx="12" fill="url(#cardGrad_toyota-fortuner-gen2)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Model Title -->
  <text x="28" y="215" fill="#ffffff" font-size="12.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800">Fortuner VRZ & GR Sport 2.8</text>
  
  <!-- Subtitle / CC & Category -->
  <text x="28" y="235" fill="#94a3b8" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600">⚡ 2.400 cc 2GD / 2.800 cc 1GD • High SUV 4x2 / 4x4</text>

  <!-- Servisin Guarantee Stamp Icon -->
  <g transform="translate(348, 208)">
    <circle cx="12" cy="12" r="12" fill="url(#accentGrad_toyota-fortuner-gen2)"/>
    <path d="M 8 12 L 11 15 L 17 9" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>