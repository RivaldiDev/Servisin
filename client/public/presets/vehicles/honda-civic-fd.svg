<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_honda-civic-fd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accentGrad_honda-civic-fd" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="cardGrad_honda-civic-fd" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="400" height="260" rx="20" fill="url(#bgGrad_honda-civic-fd)"/>
  
  <!-- Subtle Grid Lines -->
  <line x1="0" y1="65" x2="400" y2="65" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="0" y1="185" x2="400" y2="185" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  
  <!-- Ground Reflection Line -->
  <line x1="30" y1="182" x2="370" y2="182" stroke="url(#accentGrad_honda-civic-fd)" stroke-width="2" opacity="0.6"/>
  <ellipse cx="200" cy="184" rx="160" ry="12" fill="#991b1b" opacity="0.15"/>

  <!-- Vehicle Silhouette Vector Graphic -->
  <g transform="translate(0, 5)">
    
      <!-- Sedan Silhouette -->
      <path d="M 50 152 L 95 145 L 135 112 L 245 112 L 295 142 L 345 148 L 350 160 L 45 160 Z" fill="#991b1b" opacity="0.85"/>
      <path d="M 140 115 L 185 115 L 185 140 L 110 140 Z" fill="#ffffff" opacity="0.35"/>
      <path d="M 193 115 L 240 115 L 275 140 L 193 140 Z" fill="#ffffff" opacity="0.3"/>
      <!-- Wheels -->
      <circle cx="105" cy="160" r="19" fill="#0f172a"/>
      <circle cx="105" cy="160" r="11" fill="#e2e8f0"/>
      <circle cx="105" cy="160" r="5" fill="#0f172a"/>
      <circle cx="295" cy="160" r="19" fill="#0f172a"/>
      <circle cx="295" cy="160" r="11" fill="#e2e8f0"/>
      <circle cx="295" cy="160" r="5" fill="#0f172a"/>
      <!-- Dynamic Waistline -->
      <line x1="50" y1="147" x2="345" y2="147" stroke="#ef4444" stroke-width="2.5" opacity="0.8"/>
      <!-- Lights -->
      <polygon points="48,152 68,148 64,156 46,155" fill="#fef08a"/>
      <polygon points="350,148 335,146 338,155 350,154" fill="#ef4444"/>
      
  </g>

  <!-- Top Header Pill Badges -->
  <g transform="translate(20, 20)">
    <!-- Type Pill -->
    <rect x="0" y="0" width="56" height="22" rx="6" fill="#2563eb"/>
    <text x="28" y="15" fill="#ffffff" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="0.5">MOBIL</text>

    <!-- Brand Name -->
    <text x="66" y="16" fill="#f8fafc" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" letter-spacing="0.5">HONDA</text>
  </g>

  <!-- Year Range Badge Top Right -->
  <g transform="translate(260, 20)">
    <rect x="0" y="0" width="120" height="22" rx="6" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
    <text x="60" y="15" fill="#e2e8f0" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" text-anchor="middle">📅 2006 – 2011</text>
  </g>

  <!-- Bottom Details Container -->
  <rect x="14" y="194" width="372" height="54" rx="12" fill="url(#cardGrad_honda-civic-fd)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Model Title -->
  <text x="28" y="215" fill="#ffffff" font-size="12.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800">Civic FD Batman (1.8 & 2.0 i-VTEC)</text>
  
  <!-- Subtitle / CC & Category -->
  <text x="28" y="235" fill="#94a3b8" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600">⚡ 1.800 cc R18A / 2.000 cc K20Z • Sport Sedan</text>

  <!-- Servisin Guarantee Stamp Icon -->
  <g transform="translate(348, 208)">
    <circle cx="12" cy="12" r="12" fill="url(#accentGrad_honda-civic-fd)"/>
    <path d="M 8 12 L 11 15 L 17 9" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>