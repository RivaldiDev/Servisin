<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_honda-stylo-160" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accentGrad_honda-stylo-160" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="cardGrad_honda-stylo-160" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="400" height="260" rx="20" fill="url(#bgGrad_honda-stylo-160)"/>
  
  <!-- Subtle Grid Lines -->
  <line x1="0" y1="65" x2="400" y2="65" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="0" y1="185" x2="400" y2="185" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  
  <!-- Ground Reflection Line -->
  <line x1="30" y1="182" x2="370" y2="182" stroke="url(#accentGrad_honda-stylo-160)" stroke-width="2" opacity="0.6"/>
  <ellipse cx="200" cy="184" rx="160" ry="12" fill="#831843" opacity="0.15"/>

  <!-- Vehicle Silhouette Vector Graphic -->
  <g transform="translate(0, 5)">
    
      <!-- Retro Scooter (Vespa / Scoopy / Fazzio) Silhouette -->
      <path d="M 95 160 L 130 120 L 165 140 L 230 128 L 275 142 L 295 160 Z" fill="#831843" opacity="0.85"/>
      <!-- Round Retro Headlight -->
      <circle cx="138" cy="104" r="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="138" cy="104" r="6" fill="#fef08a"/>
      <!-- Retro Curved Side Pods -->
      <ellipse cx="245" cy="142" rx="30" ry="16" fill="#831843" stroke="#f472b6" stroke-width="2"/>
      <!-- Brown Retro Saddle Seat -->
      <path d="M 175 132 Q 220 122 260 132 L 255 142 L 180 142 Z" fill="#78350f"/>
      <!-- Wheels (White-wall Retro) -->
      <circle cx="100" cy="160" r="19" fill="#0f172a"/>
      <circle cx="100" cy="160" r="14" fill="#f8fafc"/>
      <circle cx="100" cy="160" r="8" fill="#94a3b8"/>
      <circle cx="285" cy="160" r="19" fill="#0f172a"/>
      <circle cx="285" cy="160" r="14" fill="#f8fafc"/>
      <circle cx="285" cy="160" r="8" fill="#94a3b8"/>
      
  </g>

  <!-- Top Header Pill Badges -->
  <g transform="translate(20, 20)">
    <!-- Type Pill -->
    <rect x="0" y="0" width="56" height="22" rx="6" fill="#d97706"/>
    <text x="28" y="15" fill="#ffffff" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="0.5">MOTOR</text>

    <!-- Brand Name -->
    <text x="66" y="16" fill="#f8fafc" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" letter-spacing="0.5">HONDA</text>
  </g>

  <!-- Year Range Badge Top Right -->
  <g transform="translate(260, 20)">
    <rect x="0" y="0" width="120" height="22" rx="6" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
    <text x="60" y="15" fill="#e2e8f0" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" text-anchor="middle">📅 2024 – 2026</text>
  </g>

  <!-- Bottom Details Container -->
  <rect x="14" y="194" width="372" height="54" rx="12" fill="url(#cardGrad_honda-stylo-160)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Model Title -->
  <text x="28" y="215" fill="#ffffff" font-size="12.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800">Stylo 160 (CBS & ABS)</text>
  
  <!-- Subtitle / CC & Category -->
  <text x="28" y="235" fill="#94a3b8" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600">⚡ 160 cc 4-Katup eSP+ 15.4 PS • Classy Fashion Skutik</text>

  <!-- Servisin Guarantee Stamp Icon -->
  <g transform="translate(348, 208)">
    <circle cx="12" cy="12" r="12" fill="url(#accentGrad_honda-stylo-160)"/>
    <path d="M 8 12 L 11 15 L 17 9" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>