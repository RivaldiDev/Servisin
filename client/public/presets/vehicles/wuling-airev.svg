<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_wuling-airev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accentGrad_wuling-airev" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="cardGrad_wuling-airev" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="400" height="260" rx="20" fill="url(#bgGrad_wuling-airev)"/>
  
  <!-- Subtle Grid Lines -->
  <line x1="0" y1="65" x2="400" y2="65" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="0" y1="185" x2="400" y2="185" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  
  <!-- Ground Reflection Line -->
  <line x1="30" y1="182" x2="370" y2="182" stroke="url(#accentGrad_wuling-airev)" stroke-width="2" opacity="0.6"/>
  <ellipse cx="200" cy="184" rx="160" ry="12" fill="#059669" opacity="0.15"/>

  <!-- Vehicle Silhouette Vector Graphic -->
  <g transform="translate(0, 5)">
    
      <!-- EV Silhouette -->
      <path d="M 60 150 L 100 112 L 170 100 L 265 100 L 320 130 L 340 152 L 340 160 L 55 160 Z" fill="#059669" opacity="0.85"/>
      <path d="M 108 114 L 170 105 L 170 138 L 92 138 Z" fill="#ffffff" opacity="0.4"/>
      <path d="M 178 105 L 260 105 L 290 138 L 178 138 Z" fill="#ffffff" opacity="0.35"/>
      <!-- Wheels (Aero Disk EV) -->
      <circle cx="108" cy="160" r="20" fill="#0f172a"/>
      <circle cx="108" cy="160" r="14" fill="#38bdf8" opacity="0.8"/>
      <circle cx="108" cy="160" r="6" fill="#f8fafc"/>
      <circle cx="288" cy="160" r="20" fill="#0f172a"/>
      <circle cx="288" cy="160" r="14" fill="#38bdf8" opacity="0.8"/>
      <circle cx="288" cy="160" r="6" fill="#f8fafc"/>
      <!-- EV Lightbar & Lightning Icon -->
      <line x1="55" y1="148" x2="340" y2="148" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 3"/>
      <path d="M 195 72 L 205 72 L 198 84 L 208 84 L 192 100 L 197 88 L 188 88 Z" fill="#38bdf8"/>
      
  </g>

  <!-- Top Header Pill Badges -->
  <g transform="translate(20, 20)">
    <!-- Type Pill -->
    <rect x="0" y="0" width="56" height="22" rx="6" fill="#2563eb"/>
    <text x="28" y="15" fill="#ffffff" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="0.5">MOBIL</text>

    <!-- Brand Name -->
    <text x="66" y="16" fill="#f8fafc" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" letter-spacing="0.5">WULING</text>
  </g>

  <!-- Year Range Badge Top Right -->
  <g transform="translate(260, 20)">
    <rect x="0" y="0" width="120" height="22" rx="6" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
    <text x="60" y="15" fill="#e2e8f0" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" text-anchor="middle">📅 2022 – 2026</text>
  </g>

  <!-- Bottom Details Container -->
  <rect x="14" y="194" width="372" height="54" rx="12" fill="url(#cardGrad_wuling-airev)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Model Title -->
  <text x="28" y="215" fill="#ffffff" font-size="12.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800">Air ev (Standard & Long Range)</text>
  
  <!-- Subtitle / CC & Category -->
  <text x="28" y="235" fill="#94a3b8" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600">⚡ Electric EV (17.3 kWh / 26.7 kWh) • Compact City EV</text>

  <!-- Servisin Guarantee Stamp Icon -->
  <g transform="translate(348, 208)">
    <circle cx="12" cy="12" r="12" fill="url(#accentGrad_wuling-airev)"/>
    <path d="M 8 12 L 11 15 L 17 9" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>