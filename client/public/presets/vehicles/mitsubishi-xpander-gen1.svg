<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_mitsubishi-xpander-gen1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accentGrad_mitsubishi-xpander-gen1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="cardGrad_mitsubishi-xpander-gen1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="400" height="260" rx="20" fill="url(#bgGrad_mitsubishi-xpander-gen1)"/>
  
  <!-- Subtle Grid Lines -->
  <line x1="0" y1="65" x2="400" y2="65" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="0" y1="185" x2="400" y2="185" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  
  <!-- Ground Reflection Line -->
  <line x1="30" y1="182" x2="370" y2="182" stroke="url(#accentGrad_mitsubishi-xpander-gen1)" stroke-width="2" opacity="0.6"/>
  <ellipse cx="200" cy="184" rx="160" ry="12" fill="#475569" opacity="0.15"/>

  <!-- Vehicle Silhouette Vector Graphic -->
  <g transform="translate(0, 5)">
    
      <!-- MPV Silhouette -->
      <path d="M 55 148 L 95 110 L 160 98 L 290 102 L 340 125 L 345 160 L 50 160 Z" fill="#475569" opacity="0.85"/>
      <path d="M 105 112 L 158 103 L 158 138 L 88 138 Z" fill="#ffffff" opacity="0.3"/>
      <path d="M 166 103 L 235 104 L 235 138 L 166 138 Z" fill="#ffffff" opacity="0.3"/>
      <path d="M 243 105 L 305 112 L 315 138 L 243 138 Z" fill="#ffffff" opacity="0.25"/>
      <!-- Wheels & Arches -->
      <circle cx="105" cy="160" r="20" fill="#0f172a"/>
      <circle cx="105" cy="160" r="11" fill="#cbd5e1"/>
      <circle cx="105" cy="160" r="5" fill="#f8fafc"/>
      <circle cx="295" cy="160" r="20" fill="#0f172a"/>
      <circle cx="295" cy="160" r="11" fill="#cbd5e1"/>
      <circle cx="295" cy="160" r="5" fill="#f8fafc"/>
      <!-- Accent Line -->
      <path d="M 60 146 Q 200 140 340 148" fill="none" stroke="#f1f5f9" stroke-width="3" opacity="0.8"/>
      <!-- Lights -->
      <polygon points="52,148 70,146 66,155 50,154" fill="#fef08a"/>
      <polygon points="345,142 335,140 337,152 345,150" fill="#ef4444"/>
      
  </g>

  <!-- Top Header Pill Badges -->
  <g transform="translate(20, 20)">
    <!-- Type Pill -->
    <rect x="0" y="0" width="56" height="22" rx="6" fill="#2563eb"/>
    <text x="28" y="15" fill="#ffffff" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="0.5">MOBIL</text>

    <!-- Brand Name -->
    <text x="66" y="16" fill="#f8fafc" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" letter-spacing="0.5">MITSUBISHI</text>
  </g>

  <!-- Year Range Badge Top Right -->
  <g transform="translate(260, 20)">
    <rect x="0" y="0" width="120" height="22" rx="6" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
    <text x="60" y="15" fill="#e2e8f0" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" text-anchor="middle">📅 2017 – 2026</text>
  </g>

  <!-- Bottom Details Container -->
  <rect x="14" y="194" width="372" height="54" rx="12" fill="url(#cardGrad_mitsubishi-xpander-gen1)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Model Title -->
  <text x="28" y="215" fill="#ffffff" font-size="12.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800">Xpander (GLX / Exceed / Sport / Ul...</text>
  
  <!-- Subtitle / CC & Category -->
  <text x="28" y="235" fill="#94a3b8" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600">⚡ 1.500 cc 4A91 MIVEC DOHC • LMPV Modern</text>

  <!-- Servisin Guarantee Stamp Icon -->
  <g transform="translate(348, 208)">
    <circle cx="12" cy="12" r="12" fill="url(#accentGrad_mitsubishi-xpander-gen1)"/>
    <path d="M 8 12 L 11 15 L 17 9" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>